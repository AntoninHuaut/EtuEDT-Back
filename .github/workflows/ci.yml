name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Test with the Go that builds the production image, not the go.mod
      # minimum: the Dockerfile's builder tag is what ships.
      - name: Read Go version from the Dockerfile
        id: go-version
        run: echo "version=$(sed -n 's/^FROM golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Run Go lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned so a new linter release cannot turn CI red without a PR;
          # Renovate bumps it.
          version: v2.15.0
